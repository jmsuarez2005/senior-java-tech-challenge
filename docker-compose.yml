version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-api
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/products
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  mongo:
    image: mongo:8.0
    container_name: product-mongo
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 2s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  benchmark:
    image: grafana/k6:2.3.0
    container_name: product-benchmark
    depends_on:
      app:
        condition: service_healthy
    command: ["run", "/perf/load-test.js"]
    environment:
      BASE_URL: http://app:8080
    volumes:
      - ./perf:/perf:ro
      - ./perf/results:/results
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M