version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-api
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/products
      REDIS_URL: redis://redis:6379
      PRODUCTS_CACHE_ENABLED: ${PRODUCTS_CACHE_ENABLED:-true}
      PRODUCTS_LOCAL_CACHE_ENABLED: ${PRODUCTS_LOCAL_CACHE_ENABLED:-true}
      PRODUCTS_AUTH_ALL: ${PRODUCTS_AUTH_ALL:-false}
      JWT_JWKS_URL: http://keycloak:8080/realms/products/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  mongo:
    image: mongo:8.0
    container_name: product-mongo
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 2s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  redis:
    image: redis:8.10-alpine
    container_name: product-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: product-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens carry this issuer whoever asks for them; the app reaches Keycloak through the backchannel name.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=50"
    volumes:
      - ./keycloak/products-realm.json:/opt/keycloak/data/import/products-realm.json:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  benchmark:
    image: grafana/k6:2.3.0
    container_name: product-benchmark
    depends_on:
      app:
        condition: service_healthy
    command: ["run", "/perf/load-test.js"]
    environment:
      BASE_URL: http://app:8080
      RUN: ${RUN:-latest}
      RATE: ${RATE:-0}
    volumes:
      - ./perf:/perf:ro
      - ./perf/results:/results
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M