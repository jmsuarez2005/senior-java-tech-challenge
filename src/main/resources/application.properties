quarkus.application.name=products
quarkus.banner.enabled=false

# Dev and test get MongoDB and Redis from Dev Services; prod reads them from the environment.
quarkus.mongodb.database=products
%prod.quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
# Bounded waits: the driver defaults are 30 s to find a server and no socket timeout at all.
quarkus.mongodb.connect-timeout=2s
quarkus.mongodb.server-selection-timeout=2s
quarkus.mongodb.read-timeout=2s
quarkus.mongodb.devservices.image-name=mongo:8.0
%prod.quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
# Generous enough not to trip on queueing under load (200 ms did on the test machine); the circuit breaker
# in RedisProductCache stops a slow Redis from costing this on every request.
quarkus.redis.timeout=500ms
# Vert.x waits 60 s by default to open a connection to an unreachable host.
quarkus.redis.tcp.connection-timeout=1s
# The default pool (6 connections, 24 waiters) overflows under 200 concurrent requests.
quarkus.redis.max-pool-size=32
quarkus.redis.max-pool-waiting=512
quarkus.redis.devservices.image-name=redis:8.10-alpine
# The cache fails open, so Redis must not make the app unhealthy.
quarkus.redis.health.enabled=false

# On by default; PRODUCTS_CACHE_ENABLED=false runs the minimal setup (app and MongoDB only).
products.cache.enabled=${PRODUCTS_CACHE_ENABLED:true}
# Upper bound on staleness if Redis misses both the new version and the delete after a write.
products.cache.ttl=1m
# In-process copy in front of Redis. Fastest option measured, but each instance keeps its own copy: a price changed
# through another instance shows up here after local.ttl at most. Turn it off when several instances serve reads
# that must agree (see the README).
products.cache.local.enabled=${PRODUCTS_LOCAL_CACHE_ENABLED:true}
products.cache.local.ttl=5s
products.cache.local.max-entries=10000

# OAuth 2.0 resource server: tokens are issued by Keycloak and checked locally against its public keys.
quarkus.oidc.application-type=service
# Authenticate only where an endpoint asks for it, instead of running the security chain on every public request.
quarkus.http.auth.proactive=false
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/products}
quarkus.oidc.roles.role-claim-path=scope
quarkus.oidc.roles.role-claim-separator=\u0020
quarkus.keycloak.devservices.enabled=false
# Tests use the mock OIDC server from quarkus-test-oidc-server and sign tokens with its test key.
%test.quarkus.oidc.auth-server-url=${keycloak.url:replaced-by-test-resource}/realms/quarkus/
%test.quarkus.oidc.token.issuer=https://server.example.com
%test.smallrye.jwt.sign.key.location=privateKey.jwk
# The statement's automated tests call the mandatory endpoints without a token, so by default only the endpoints
# that change or delete prices require one. PRODUCTS_AUTH_ALL=true requires a valid token on every /products call.
quarkus.http.auth.permission.products.paths=/products,/products/*,/v1/products,/v1/products/*
quarkus.http.auth.permission.products.policy=authenticated
quarkus.http.auth.permission.products.enabled=${PRODUCTS_AUTH_ALL:false}

# Same health URL as before, so the compose healthcheck does not change.
quarkus.smallrye-health.root-path=/actuator/health
quarkus.smallrye-health.ui.enabled=false

quarkus.swagger-ui.always-include=true
# The OAuth scheme is declared on the resource; the automatic one Quarkus adds for OIDC would duplicate it.
quarkus.smallrye-openapi.auto-add-security=false
quarkus.swagger-ui.path=/swagger-ui
# General description, error responses and schemas live in META-INF/openapi.yaml; endpoints come from annotations.

# Plain text in dev and tests, one JSON object per line in prod, ready for a log shipper (Loki, ELK, Datadog).
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
quarkus.log.console.json.mdc.flat-fields=true
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1}] [%X{requestId}] %s%e%n
# Prometheus metrics at /q/metrics: JVM, cache reads by result, cache write errors, circuit breaker.
quarkus.micrometer.export.prometheus.path=metrics
# Per-request HTTP timers (and the Vert.x instrumentation they need) cost about 240 us of CPU per request under load,
# roughly 18%. Off by default; build with -Dquarkus.micrometer.binder.http-server.enabled=true to get them.
quarkus.micrometer.binder.http-server.enabled=false
quarkus.micrometer.binder.vertx.enabled=false
quarkus.micrometer.binder.http-client.enabled=false

quarkus.log.level=WARN
quarkus.log.category."com.mango.products".level=INFO
quarkus.log.category."io.quarkus".level=INFO
