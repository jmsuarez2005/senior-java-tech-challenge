quarkus.application.name=products
quarkus.banner.enabled=false

quarkus.mongodb.database=products
%prod.quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.connect-timeout=2s
quarkus.mongodb.server-selection-timeout=2s
quarkus.mongodb.read-timeout=2s
quarkus.mongodb.devservices.image-name=mongo:8.0
%prod.quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.timeout=500ms
quarkus.redis.tcp.connection-timeout=1s
quarkus.redis.max-pool-size=32
quarkus.redis.max-pool-waiting=512
quarkus.redis.devservices.image-name=redis:8.10-alpine
quarkus.redis.health.enabled=false

products.cache.enabled=${PRODUCTS_CACHE_ENABLED:true}
products.cache.ttl=1m
products.cache.local.enabled=${PRODUCTS_LOCAL_CACHE_ENABLED:true}
products.cache.local.ttl=5s
products.cache.local.max-entries=10000

quarkus.http.auth.proactive=false
mp.jwt.verify.publickey.location=${JWT_JWKS_URL:http://localhost:8180/realms/products/protocol/openid-connect/certs}
mp.jwt.verify.issuer=${JWT_ISSUER:http://localhost:8180/realms/products}
smallrye.jwt.path.groups=scope
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.issuer=https://products.test
%test.smallrye.jwt.sign.key.location=privateKey.pem
quarkus.http.auth.permission.products.paths=/products,/products/*,/v1/products,/v1/products/*
quarkus.http.auth.permission.products.policy=authenticated
quarkus.http.auth.permission.products.enabled=${PRODUCTS_AUTH_ALL:false}

quarkus.smallrye-health.root-path=/actuator/health
quarkus.smallrye-health.ui.enabled=false

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.auto-add-security=false
quarkus.swagger-ui.path=/swagger-ui

quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
quarkus.log.console.json.mdc.flat-fields=true
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1}] [%X{requestId}] %s%e%n
quarkus.micrometer.export.prometheus.path=metrics
quarkus.micrometer.binder.http-server.enabled=false
quarkus.micrometer.binder.vertx.enabled=false
quarkus.micrometer.binder.http-client.enabled=false
quarkus.fault-tolerance.metrics.enabled=false

quarkus.log.level=WARN
quarkus.log.category."com.mango.products".level=INFO
quarkus.log.category."io.quarkus".level=INFO

%test.quarkus.jacoco.reuse-data-file=true
