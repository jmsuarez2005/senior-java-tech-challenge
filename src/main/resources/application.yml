spring:
  application:
    name: products
  main:
    lazy-initialization: true
    banner-mode: off
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/products}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 500ms
      connect-timeout: 2s

products:
  cache:
    enabled: ${PRODUCTS_CACHE_ENABLED:false}
    ttl: 10m

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: false

logging:
  level:
    root: WARN
    com.mango.products: INFO
    org.springdoc.core.events: ERROR

---
spring:
  config:
    activate:
      on-profile: test
  main:
    lazy-initialization: false

products:
  cache:
    enabled: true
