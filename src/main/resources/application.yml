spring:
  application:
    name: products
  main:
    lazy-initialization: true
    banner-mode: off
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/products}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: WARN
    com.mango.products: INFO
    org.springdoc.core.events: ERROR

---
spring:
  config:
    activate:
      on-profile: test
  main:
    lazy-initialization: false
