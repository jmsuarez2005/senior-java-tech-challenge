name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, tests and coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: sh gradlew build --no-daemon
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/jacoco-report
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

  functional:
    name: Functional tests (Karate) on the compose stack
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Start the stack
        run: docker compose up -d --build app keycloak
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          exit 1
      - name: Wait for Keycloak to issue tokens
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null -d grant_type=client_credentials -d client_id=products-writer \
              -d client_secret=products-writer-secret \
              http://localhost:8180/realms/products/protocol/openid-connect/token && exit 0
            sleep 5
          done
          exit 1
      - name: Run the Karate suite
        run: sh gradlew functionalTest --no-daemon
      - name: Karate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: karate-report
          path: build/karate-reports
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
