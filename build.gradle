plugins {
	id 'java'
	id 'jacoco'
	id 'io.quarkus' version '3.40.1'
}

group = 'com.mango'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

sourceSets {
	functionalTest {
		resources.srcDir 'seed'
	}
}

dependencies {
	implementation enforcedPlatform('io.quarkus.platform:quarkus-bom:3.40.1')
	implementation 'io.quarkus:quarkus-rest-jackson'
	implementation 'io.quarkus:quarkus-hibernate-validator'
	implementation 'io.quarkus:quarkus-mongodb-client'
	implementation 'io.quarkus:quarkus-redis-client'
	implementation 'io.quarkus:quarkus-caffeine'
	implementation 'io.quarkus:quarkus-smallrye-health'
	implementation 'io.quarkus:quarkus-smallrye-openapi'
	implementation 'io.quarkus:quarkus-smallrye-fault-tolerance'
	implementation 'io.quarkus:quarkus-logging-json'
	implementation 'io.quarkus:quarkus-smallrye-jwt'
	implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'

	testImplementation 'io.quarkus:quarkus-junit5'
	testImplementation 'io.quarkus:quarkus-jacoco'
	testImplementation 'io.rest-assured:rest-assured'
	testImplementation 'io.quarkus:quarkus-smallrye-jwt-build'
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'

	functionalTestImplementation 'io.karatelabs:karate-junit6:2.1.4'
	functionalTestRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
	functionalTestRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-parameters'
}

tasks.named('test') {
	systemProperty 'java.util.logging.manager', 'org.jboss.logmanager.LogManager'
	jacoco {
		excludeClassLoaders = ['*QuarkusClassLoader']
		destinationFile = layout.buildDirectory.file('jacoco-quarkus.exec').get().asFile
	}
}

tasks.named('jacocoTestReport') {
	enabled = false
}

tasks.register('functionalTest', Test) {
	description = 'Runs the Karate functional suite against a running API (BASE_URL, AUTH_URL).'
	group = 'verification'
	testClassesDirs = sourceSets.functionalTest.output.classesDirs
	classpath = sourceSets.functionalTest.runtimeClasspath
	useJUnitPlatform()
	systemProperty 'baseUrl', System.getenv('BASE_URL') ?: 'http://localhost:8080'
	systemProperty 'authUrl', System.getenv('AUTH_URL') ?: 'http://localhost:8180'
	systemProperty 'karate.output.dir', layout.buildDirectory.dir('karate-reports').get().asFile.path
	outputs.upToDateWhen { false }
	doFirst { systemProperties.remove('java.util.logging.manager') }
}
